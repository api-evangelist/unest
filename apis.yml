description: >-
  UNest is a Los Angeles-based fintech app that helps parents and families
  save and invest for their children's futures through UTMA/UGMA custodial
  investment accounts, with brand rewards contributions, gifting, financial
  literacy content, and term life insurance offered through Ladder. UNest
  Advisers, LLC is an SEC-registered investment adviser, with brokerage
  through UNest Securities, LLC (FINRA/SIPC) and clearing through Apex
  Clearing. The company is a consumer mobile-app business and publishes no
  public developer API, though its site ships a real llms.txt. Surfaced as a
  500 Global portfolio company in the API Evangelist network.
